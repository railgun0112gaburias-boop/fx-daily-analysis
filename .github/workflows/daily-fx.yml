name: FX 5 timeframe daily report
on:
  schedule:
    - cron: '7 7 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      quick_check:
        description: 'Short connection-only test, not full analysis'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/daily-fx.yml'
permissions:
  contents: write
concurrency:
  group: fx-daily-report
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FX_QUICK_CHECK: ${{ (inputs.quick_check == true) && '1' || '0' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Mark current report attempt
        run: echo "FX_RUN_STARTED_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Japanese chart fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run indicator unit tests
        run: npm test
      - name: Fetch actual OHLC and compute indicators
        id: analysis
        timeout-minutes: 20
        run: npm run analyze
      - name: Verify current report and record failures
        id: finalize
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        env:
          FX_ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: node src/finalize-run.mjs
      - name: Publish market data report
        if: always() && !cancelled() && steps.finalize.outputs.publishable == 'true' && env.FX_QUICK_CHECK != '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports/
          git diff --cached --quiet || (git commit -m 'Update daily FX report and run status' && git push origin HEAD:main)
